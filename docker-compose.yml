services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: editorialdata-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - editorialdata
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: editorialdata-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - editorialdata
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: editorialdata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: editorialdata
      POSTGRES_USER: editorial
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - editorialdata-postgres-data:/var/lib/postgresql/data
    networks:
      - editorialdata

  node:
    image: node:22-alpine
    container_name: editorialdata-node
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
    ports:
      - "5173:5173"
    networks:
      - editorialdata
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - frontend

networks:
  editorialdata:
    driver: bridge

volumes:
  editorialdata-postgres-data:
    driver: local